name: CI

# Проверка каждого PR перед мерджем: линт (0 ошибок — долг разгребли, warnings
# не блокируют) и тесты — в первую очередь калькуляторы, где регрессия стоит денег.
# Сборку не гоняем: ей нужны боевые env, фальшивый красный хуже отсутствия.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
