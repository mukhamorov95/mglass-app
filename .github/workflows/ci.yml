name: CI

# Проверка каждого PR перед мерджем: линт (0 ошибок — долг разгребли, warnings
# не блокируют), ТИПЫ и тесты — в первую очередь калькуляторы, где регрессия стоит денег.
# Сборку не гоняем: ей нужны боевые env, фальшивый красный хуже отсутствия.
# А вот tsc --noEmit никаких env НЕ требует — это статическая проверка. Довод против
# сборки на неё не распространяется, и её отсутствие уже стоило красного main: #321
# уехал с двумя TS7053, линт и тесты их не видят, поймала соседняя вкладка случайно.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
