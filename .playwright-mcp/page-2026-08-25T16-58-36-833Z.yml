    - heading "Душевые кабины на заказ" [level=2] [ref=e2360]
    - generic [ref=e2361]: Душевые кабины по индивидуальным размерам — мечта современного потребителя. Они позволяют максимально эргономично использовать пространство даже самой крошечной ванной комнаты. Угловые или прямоугольные образцы занимают мало места. Они органично вписываются в интерьер, словно сливаясь со стенами. Наша компания Душ на заказ занимается производством современных и качественных душевых кабин на заказ в Москве.
    - heading "Эксклюзивные проекты душевых кабин" [level=2] [ref=e2371]
    - generic [ref=e2372]: "Наша компания выполняет проектирование и установку любой модели. При изготовлении стеклянной душевой кабины учитываются все особенности планировки помещения: выступы, местонахождение раковины и других сантехнических атрибутов. Во время разработки специалисты ориентируются также на положение душевой кабинки относительно входной двери или окна (при наличии такового).Наши продукты отличаются высокой функциональностью. Базовая комплектация включает все необходимое для комфортного проведения водных процедур. Но по желанию клиента выполняется дооснащение дополнительными комплектующими."
    - heading [level=2] [ref=e2382]:
      - strong [ref=e2383]: Лучший материал душевых кабин на заказ
    - generic [ref=e2389]:
      - text: "Стеклянные душевые кабины практичны и эстетичны одновременно. Они визуально расширяют пространство, наполняя его воздушной легкостью и приятным блеском. Гигиенические процедуры станут настоящим релаксом как в душевой, так и за стеклянной шторкой для ванны.Преимущества стекла как рабочего материала:"
      - list [ref=e2390]:
        - listitem [ref=e2391]: термостойкость;
        - listitem [ref=e2392]: сопротивляемость к перепаду температур;
        - listitem [ref=e2393]: гигиеничность;
        - listitem [ref=e2394]: устойчивость к ударной нагрузке;
        - listitem [ref=e2395]: невосприимчивость к царапинам.
      - text: Душевые кабинки с матовым стеклом вписываются в любой интерьер — от классического до современного минималистического. В то же время они не только изящны, но и очень практичны.Закаленное стекло толщиной 8 мм позволяет создать достаточно прочную конструкцию. Это полностью герметичная система, поскольку в работе наши профессионалы используют фирменный прозрачный силиконовый герметик.Края конструкции укрепляются уплотнителем из ПВХ. Это обеспечивает ей дополнительную устойчивость.Душ на заказ воплотит любой проект. Вы получите идеальную стеклянную душевую кабину безупречного качества и по разумной цене.
    - heading "Как выбрать форму кабинки?" [level=2] [ref=e2400]
    - generic [ref=e2406]:
      - text: "Изготовление душевых кабин из стекла на заказ начинается с замеров и составления план-схемы. На нем графически обозначаются все выступы в стенах и полу. Отдельно указывается расположение сантехнического оборудования, не подлежащего перемещению. Далее намечается контур будущей конструкции. На схеме вы увидите:"
      - list [ref=e2407]:
        - listitem [ref=e2408]: Какую сторону можно удлинить.
        - listitem [ref=e2409]: Есть ли возможность расширения или сужения прохода.
        - listitem [ref=e2410]: Подходящий способ открывания.
      - text: "Мы изготавливаем распашные или раздвижные системы дверей. Для первой понадобится дополнительное пространство рядом. Вторая более эргономична. Заказывая душевую кабину под размер по предварительно составленному эскизу, вы получите удобную кабинку даже в самой малогабаритной ванной. Этим индивидуальное проектирование отличается от типовых образцов. Стеклянная конструкция может иметь форму:"
      - list [ref=e2411]:
        - listitem [ref=e2412]: Пристенную (прямоугольник или квадрат). Состоит из двух перегородок и одной дверцы. Обычно это П-образный контур.
        - listitem [ref=e2413]: Угловую. Самый эргономичный вариант. Подходит для маленьких санузлов. Угол помещения отсекается навесной стеклянной дверью.
        - listitem [ref=e2414]: Интегрированную в нишу. В качестве ограждающей панели служит дверца. Этот вариант относится к наиболее прочным, поскольку две капитальные стены — это часть конструкции. В них можно вмонтировать и душевую стойку, и дополнительное оборудование.
        - listitem [ref=e2415]: Овальную. Будучи разновидностью пристенных моделей, закругленные кабинки наименее травмоопасны из-за отсутствия углов.
      - text: Самый экзотический вариант — круглый душ. Технически его можно установить в любой части ванной комнаты. Поскольку стеклянное полотно легко поддается обработке, ему можно придать форму полуовала. Однако на практике этот вариант используется крайне редко. Он не подходит для типовых городских квартир. Его монтируют в просторных загородных особняках, где нет недостатка в полезной площади.
    - heading "Фурнитура" [level=2] [ref=e2420]
