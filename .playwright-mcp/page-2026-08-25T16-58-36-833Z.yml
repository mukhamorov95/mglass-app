      - list [ref=e2427]:
        - listitem [ref=e2428]: «Стандарт» (Китай). Все 5 коллекций имеют сертификат качества. Петли предназначены для эксплуатации в условиях повышенной влажности. Защитный слой продлевает срок их годности. Дизайн отличается лаконичностью и элегантностью. Гарантия — 1 год.
