      - generic [ref=e1589]: "Мы подберем фурнитуру для вашей душевой кабины, в зависимости от вкусовых предпочтений и бюджета. На выбор у нас есть 2 ценовые линейки фурнитуры:"
    - generic [ref=e1594]:
      - generic [ref=e1600]:
        - generic [ref=e1601]: Стандарт
        - generic [ref=e1602]: "Латунная фурнитура линейки «Стандарт» — это оптимальное соотношение доступной цены и высокого качества. От «Премиума» отличается более скромным дизайном, но и здесь есть выбор из 5 разных коллекций. Петли открываются плавно и бесшумно. Удобная и качественная конструкция.Гарантия 1 год. Производитель: Китай.Отличное решение для людей, ценящих практичность и надежность."
      - generic [ref=e1608]:
        - generic [ref=e1609]: Премиум
        - generic [ref=e1610]: "Преимущества данной линейки — элегантный дизайн и безупречное качество. Болты закрыты декоративными крышками, фурнитура смотрится легко и изящно. Благодаря узкому зазору петель вероятность протечки сведена к минимуму. Функция самозакрывания держит душевую кабину всегда в закрытом положении и обеспечивает плавный, мягкий, практически бесшумный ход петель. В линейке «Премиум» представлено 9 коллекций, различающихся по дизайну.Гарантия 3 года. Производитель: Германия.Великолепный выбор для тех, кому важна эстетичность дизайна, комфорт и качество."
