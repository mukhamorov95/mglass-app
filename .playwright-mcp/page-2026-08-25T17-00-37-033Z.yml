  - generic [ref=f16e1316]: Душевые перегородки из стекла на заказ
  - generic [ref=f16e1321]: Компания «Душ на заказ» принимает заказы на проектирование и установку душевых перегородок. Клиенты могут выбрать типовой вариант или заказать эксклюзивный проект. Мы выполняем работу любой сложности с учетом всех технических и эстетических предпочтений заказчика.
  - generic [ref=f16e1327]: Стильные решения душевых перегородок
  - generic [ref=f16e1337]:
    - text: "Сделать ванную комнату более уютной и функциональной помогут изящные перегородки из стекла. Они свободно пропускают свет, поэтому интерьер не утяжеляется. Он становится невесомым и наполняется ненавязчивым посверкиванием.Стекло — самый стильный и современный материал. Оно обладает не только эстетическими свойствами. Новейшие технологические методики придают ему необычайную прочность.Сохраняя свою воздушность, полотно обретает множество полезных свойств:"
    - list [ref=f16e1338]:
      - listitem [ref=f16e1339]: устойчивость к механическому воздействию;
      - listitem [ref=f16e1340]: сопротивляемость к появлению царапин и пятен;
      - listitem [ref=f16e1341]: термостойкость;
      - listitem [ref=f16e1342]: устойчивость к перепаду температур.
    - text: "В своих проектах наши специалисты используют не только классическое прозрачное стекло для перегородок. Большой популярностью пользуются конструкции для ванных из бронзового или осветленного полотна. Каждое из них может быть матовым.Особой дизайнерской утонченностью обладают перегородки для душа из стекла с орнаментом. Рисунок наносится по пескоструйной технологии. В результате получается изящная полупрозрачная композиция для ванной.Практическое назначение стеклянных перегородок — блокировка брызг. Стены и пол будут всегда защищены, что позволит поддерживать гигиеническую норму и упростит уборку в санузле.Преимущества душевых перегородок из стекла:"
    - list [ref=f16e1343]:
      - listitem [ref=f16e1344]: индивидуальный декор;
      - listitem [ref=f16e1345]: прочность и устойчивость;
      - listitem [ref=f16e1346]: простота в уходе;
      - listitem [ref=f16e1347]: длительный срок эксплуатации;
      - listitem [ref=f16e1348]: герметичность;
      - listitem [ref=f16e1349]: эстетичность.
    - text: Количество конфигураций практически неисчерпаемо. Проект перегородки формируется от габаритов и архитектурных особенностей помещения.
  - generic [ref=f16e1350]: Душевые перегородки на заказ
  - generic [ref=f16e1355]: Алгоритм работы с заказчиками отработан многолетней практикой. После получения заявки на изготовление перегородки в душ наш менеджер отправляется для выполнения замеров. Данная услуга — бесплатная, но она имеет принципиальное значение. От точности замеров зависит качество монтажа стеклянной конструкции. Клиент принимает участие в разработке проекта. Чтобы конструкция была гармоничной, мы предлагаем консультационные услуги профессиональных дизайнеров. Каждое полотно изготавливается индивидуально. Завершающий этап — доставка и монтажные работы.
