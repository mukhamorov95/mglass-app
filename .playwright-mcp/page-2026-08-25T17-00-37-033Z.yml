    - heading "Какую фурнитуру мы предлагаем для душевых перегородок?" [level=2] [ref=f16e597]
    - generic [ref=f16e598]: "Мы подберем фурнитуру для стеклянной перегородки в душевую, в зависимости от вкусовых предпочтений и бюджета. На выбор у нас есть 2 ценовые линейки фурнитуры:"
  - generic [ref=f16e601]:
    - generic [ref=f16e607]:
      - generic [ref=f16e608]: Стандарт
      - generic [ref=f16e609]: Недорогая линейка фурнитуры из латуни. Качественная сборка, приятный дизайн. Петли плавно открываются, без скрипов и посторонних звуков. Внешне уступают премиальной линейке, но значительно выигрывают за счет своей стоимости. Оптимальный вариант по соотношению цена/качество. Всего в этой линейке 5 коллекций разного дизайна.Гарантия 1 год. Производитель — Китай.Если для вас в первую очередь важна практичность и конечная стоимость изделия, то выбирайте эту линейку.
    - generic [ref=f16e615]:
      - generic [ref=f16e616]: Премиум
      - generic [ref=f16e617]: Изысканная фурнитура высочайшего качества. Крепежные болты скрыты декоративными крышками, что делает эту линейку более утонченной. Петли обладают минимальным зазором, который исключает вероятность протечки, а так же оснащены функцией самозакрывания и исключительно плавно открываются. Всего в этой линейке 9 коллекций разного дизайна.Гарантия 3 года. Производитель — Германия.Эта линейка подойдет вам, если для вас помимо всего прочего не менее важен внешний вид и эстетика.
