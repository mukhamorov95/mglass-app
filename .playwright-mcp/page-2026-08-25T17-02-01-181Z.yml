  - generic [ref=f21e204]:
    - generic:
      - generic [ref=f21e206]:
        - text: Фирма-изготовитель гарантирует соответствие изделий требованиям
        - link "ТУ (Технических Условий)." [ref=f21e207] [cursor=pointer]:
          - /url: https://dysh17.ru/uslugi/tehnicheskie-usloviya/
        - text: Гарантийный срок на изделие – 25 лет* со дня изготовления при соблюдении условий эксплуатации, хранения, монтажа и транспортирования.
      - generic [ref=f21e208]: В течение гарантийного периода ООО «ЗЕРКАЛЬНО-СТЕКОЛЬНАЯ КОМПАНИЯ» бесплатно устраняет путем ремонта или замены производственные дефекты, вызванные отклонением от значений физико-механических характеристик материалов (появление свили, инородных включений, следов выщелачивания, внутренних пузырей и т.п.) в рамках ГОСТов Р 54170-2010, Р 54161-2010 или дефектов, вызванных недостаточным качеством обработки материалов в рамках ТУ ООО «ЗЕРКАЛЬНО-СТЕКОЛЬНАЯ КОМПАНИЯ».
  - generic [ref=f21e214]:
    - strong [ref=f21e215]: "Гарантия ПРЕДОСТАВЛЯЕТСЯ:"
    - list [ref=f21e216]:
      - listitem [ref=f21e217]: При условии сохранения кассового чека и заказ-наряда в течение всего гарантийного срока.
      - listitem [ref=f21e218]: На изделия, которые использовались в соответствии с правилами эксплуатации.
    - strong [ref=f21e219]: "Гарантия НЕ ПРЕДОСТАВЛЯЕТСЯ в случае:"
    - list [ref=f21e220]:
      - listitem [ref=f21e221]: Механических повреждений (царапины, потертости, сколы, щербины, и т.п.)
      - listitem [ref=f21e222]: Дефекты, вызванные механическим, химическим, тепловым и др. воздействиями, не предусмотренными правилами эксплуатации для данного вида изделий.
      - listitem [ref=f21e223]: Воздействия агрессивной среды, загрязнения, окисления
      - listitem [ref=f21e224]: Внесения заказчиком технических изменений в конструкцию изделия, либо его комплектующих
      - listitem [ref=f21e225]: Нарушения правил эксплуатации
      - listitem [ref=f21e226]: Естественного износа изделия
      - listitem [ref=f21e227]: Заказчик предпочел ультрафиолетовую печать без цветопробы и недоволен результатом цветопередачи (яркость, оттенок цвета и т.п.)
      - listitem [ref=f21e228]: Несоблюдения инструкции по монтажу
      - listitem [ref=f21e229]: Монтаж изделий не рекомендованными представителями ООО «МФЗ»
      - listitem [ref=f21e230]: Монтажа иным способом, кроме рекомендуемого по ГОСТ Р 54161-2010 и Европейскому стандарту CEN
    - text: "* Гарантийный срок на амальгаму, ультрафиолетовую печать, ультрафиолетовую склейку, изделия со стразами, витражи, триплекс, комплектующие, фурнитуру, нагревательный элемент для зеркал и багет составляет 12 месяцев со дня изготовления изделия, при соблюдении правил эксплуатации, хранения, транспортирования и монтажа.* Гарантийный срок на амальгаму зеркал с улучшенным покрытием составляет 24 месяца со дня изготовления изделия, при соблюдении правил эксплуатации, хранения, транспортирования и монтажа."
    - strong [ref=f21e231]: СЛУЖБА СЕРВИСА
    - text: Служба сервиса проводит товарную экспертизу выявленных недостатков, определяет характер дефекта — заводской брак или результат неправильной эксплуатации. После проведения экспертизы и дальнейшего экспертного заключения товар с заводским браком подлежит гарантийному ремонту. Если ремонт невозможен, то при предъявлении экспертного заключения Продавец производит обмен товара с заводским дефектом на товар надлежащего качества.
    - strong [ref=f21e232]: При бережном отношении наши изделия будут служить Вам долгие годы.
