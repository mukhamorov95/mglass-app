    - generic:
      - generic [ref=f26e210]:
        - generic [ref=f26e211]: Московская Зеркальная Фабрика основана в 1961 году
        - generic [ref=f26e212]: Более пятидесяти лет фабрика считается непревзойденным лидером по производству самой разнообразной продукции, изготовленной из стекла и зеркал.
        - generic [ref=f26e213]: На сегодня, компания владеет всеми видами технологий по изготовлению зеркал, продукции из зеркального и стеклянного полотна. "Московская Зеркальная Фабрика" отслеживает все инновации в зеркально-стекольном секторе и предлагает своим потребителям самую современную и качественную продукцию.
      - generic [ref=f26e214]: Наша система многоуровневого контроля отслеживает, чтобы качество выпускаемой продукции соответствовало всем международным и европейским стандартам. Полностью компьютеризированный процесс от оформления заказа до его выдачи позволяет точно отслеживать весь производственный цикл и максимально сокращает время изготовления любых, даже самых сложных и нестандартных заказов на изготовление зеркал и стеклоизделий.Душевые ограждения от "Московской Зеркальной Фабрики" производятся на собственном заводе в г.Чехов. Полностью автоматизированный процесс и новейшее европейское оборудование позволяют выполнять заказы любой сложности. Мы работаем напрямую с лидирующими поставщиками стекла и фурнитуры, не отдаём работу на "подряд", благодаря чему предлагаем клиентам доступные цены на продукцию.
