    - heading "Разработка дизайн-проекта" [level=1] [ref=f30e201]
    - generic [ref=f30e202]: Консультируясь с менеджером, Вы выбираете материалы для душевой кабины и её конструктив. Хотите сделать заказ особенным? Команда дизайнеров "Московской Зеркальной Фабрики" поможет выбрать узор и вид художественной обработки. В наших постоянно обновляющийся каталогах более 7000 готовых эскизов. Выберите свой или закажите разработку индивидуального дизайна. Специалист подготовит для Вас несколько вариантов и учтет все пожелания. Хотите увидеть, как изделие будет смотреться в интерьере? Отправьте нам фото комнаты - художники сделают 3D-визуализацию. А наши консультанты по фурнитуре помогут подобрать необходимые элементы, которые выгодно дополнят душевую и будут органично сочетаться с элементами интерьера. Все образцы комплектующих представлены на демонстрационных стендах в разных цветовых решениях.
