                  - listitem [ref=f42e203]:
                    - paragraph [ref=f42e204]: Стекло закаленное, толщ. 8 мм., тех. отверстия и вырезы, полированная еврокромка, Pilkington (Англия).
                  - listitem [ref=f42e205]: Петли для душевых дверей серии PREMIUM с лифтовым механизмом, повышенная герметичность за счёт беспрерывного уплотнения, защита от провисания, материал латунно-цинковый сплав, цвет глянцевый хром.
                  - listitem [ref=f42e206]: Открывание двери внутрь/наружу.
                  - listitem [ref=f42e207]: Ручка для душевых дверей «скоба» серии PREMIUM, материал латунно-цинковый сплав, цвет глянцевый хром.
                  - listitem [ref=f42e208]: Уплотнители защиты от брызг «REHAU».
                  - listitem [ref=f42e209]: Магнитный уплотнитель с притворным профилем, прозрачный ПВХ, «REHAU».
