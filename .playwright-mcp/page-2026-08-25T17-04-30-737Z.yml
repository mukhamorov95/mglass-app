  - generic [ref=f67e36]:
    - heading "Стандартные сроки изготовления" [level=2] [ref=f67e37]
    - generic [ref=f67e38]:
      - generic [ref=f67e39]:
        - generic [ref=f67e40]:
          - text: "Стандартный срок изготовления индивидуальных стеклоизделий по размерам заказчика составляет от 1 до 10 дней, но не более 30 календарных дней – такой диапазон дат является следствием сложного технологического процесса и напрямую зависит от характера и объемов, поступающих на производство индивидуальных заказов. Процесс и сроки изготовления индивидуального заказа по размерам заказчика состоит из нескольких взаимосвязанных технологических этапов, которые в свою очередь жестко привязаны к временным производственным и финансовым циклам: 1. Этап – из выбранного и оплаченного вами материала вырезаются заготовки. 2. Этап – Обработка заготовок для получения готового изделия: полировка торцов заготовок, сверление отверстий, закалка и другие операции, выбранные и оплаченные вами при размещении заказа. Процесс обработки заготовок также является многоэтапным и последовательным и напрямую зависит от количества требуемых операций. После каждой операции, которые выполняются в строгой технологической последовательности мастера осуществляют проверку качества выполнения работ, что также влияет на общее время исполнения заказа. 1. Этап – финишная проверка изготовленного изделия Отделом Контроля Качества на соответствие, указанным в заказе параметрам и качества выполнения работ. 2. Этап – по мере поступления заказанной и предоплаченной под ваш заказ фурнитуры от сторонних поставщиков комплектация заказа (при наличии в заказе). 3. Этап – упаковка изделий. 4. Этап – Транспортировка до пункта выдачи на Нагорной д. 17. Поскольку описанные выше процессы требуют значительных временных затрат, для выполнения всех взятых на себя обязательств по срокам выполнения заказов в нашей компании внедрен полностью автоматизированный процесс изготовления заказных изделий, который подразумевает незамедлительное начало выполнение работ по вырезанию заготовок сразу после подтверждения оплаты(предоплаты). В случае выбора Вами материалов и/или комплектующих, не находящихся на наших складах (качество и наличие, которых мы можем Вам гарантировать со 100% уверенностью) и требующих производить закупку у сторонних поставщиков, срок выполнения комплектации может быть продлен до 3-х календарных месяцев, поскольку зачастую закупка таких материалов производится в странах Евросоюза и требует значительных временных затрат на транспортировку и таможенную очистку. К сожалению, Зеркальная Фабрика и ее сотрудники не могут влиять на скорость работы компаний поставщиков, перевозчиков и таможенных терминалов РФ. В связи с этим, для предоставления Вам максимально достоверной информации, точные даты поставки товара наши сотрудники могут сообщить ТОЛЬКО после поступления комплектующих на НАШ склад. Но при оформлении каждого индивидуального заказа, мы делаем все возможное для ускорения поставки комплектующих от поставщиков, а также максимально возможно быстрой комплектации Вашего заказа. По готовности заказа, Вы получите смс-уведомление, также отслеживать ход и готовность вашего заказа Вы всегда можете в личном кабинете. В случае поступления некорректной информации или нарушении, указанных в договоре сроков изготовления, Вы можете обраться в службу техподдержки, написав сообщение с номером заказа в личном кабинете. В случае нарушения сроков, предусмотренных договором, Вам будет выплачена неустойка в рамках действующего договора. Сроки согласования макетов и чертежей"
          - paragraph [ref=f67e41]: В связи со сжатыми сроками и полностью автоматизированным процессом изготовления стеклоизделий, а также во исполнение взятых на себя обязательств, Вам необходимо ознакомиться (или произвести корректировку) чертежей/макетов данного заказа в трехдневный срок. При отсутствии с Вашей стороны письменных корректировок и противоречий первоначально оформленным чертежам и макетам, заказ автоматически передается в производство без дополнительного уведомления
        - generic: Тариф ПРИОРИТИ - Стеклоизделия по данной категории заказа изготавливаются с помощью оснасток, приспособлений, цветопроб без дополнительного взимания денег; проходят индивидуальный ручной многоуровневый контроль качества; производится первичная индивидуальная выборка материалов и комплектующих; изготовление таких изделий осуществляется приоритетно вне зависимости от загруженности производственного цикла, поставка фурнитуры осуществляется в минимально возможные сроки посредством использования исключительно экспресс-услуг по доставке материалов и комплектующих при необходимости с помощью авиасообщения. Заказ размещенный по тарифу ПРИОРИТИ подразумевает, что на момент оформления заказа клиент ознакомлен с полным предлагаемым ассортиментом, и главным критерием для клиента являются повышенные требования к качеству материалов, комплектующих, и срокам изготовления индивидуальных изделий. Сроки изготовления стеклоизделий по тарифу ПРИОРИТИ – осуществляются в максимально возможные сжатые сроки насколько это позволяет технологический процесс. Сроки поставок фурнитуры и комплектующих оговариваются в момент оплаты клиентом заказа. В случае отсутствия возможности осуществить поставку комплектующих, в оговоренные сроки с клиентом, компанией производится возврат разницы в стоимости между тарифами ПРИОРИТИ и ЭКОНОМ.
